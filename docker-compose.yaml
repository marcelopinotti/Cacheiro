services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 127.0.0.1: acessível da máquina host, nunca da internet (ver oracle.md)
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7.0.14
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  pedido-service:
    build: ./pedido-service
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL}
      CATALOGO_URL: ${CATALOGO_URL}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      catalogo-service:
        condition: service_started

  catalogo-service:
    build: ./catalogo-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vitrine-service:
    build: ./vitrine-service
    restart: unless-stopped
    environment:
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      CATALOGO_URL: ${CATALOGO_URL}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - catalogo-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    # único serviço público. local fica em 4200; na VM, FRONTEND_PORT=80 no .env
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - vitrine-service
      - catalogo-service
      - pedido-service
      # nginx resolve os nomes no boot: sem o grafana no ar ele nem sobe
      - grafana

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - vitrine-service

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # para a aba "métricas" do frontend conseguir embutir o dashboard
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # servido em /grafana/ por trás do nginx do frontend
      GF_SERVER_DOMAIN: ${PUBLIC_HOST:-localhost}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./observability/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/cacheiro.json
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
